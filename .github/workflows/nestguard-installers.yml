name: Nestguard installers

# Builds desktop installers for the Nestguard game.
# - Push to main (or the claude/beautiful-euler-b2t7tl branch) with a change to the game or the desktop app:
#   builds the installers and publishes them on a release named after the version in desktop/package.json.
#   Bump that version to make a new release; the same version updates the existing release.
# - Push a tag like "v1.0.0" to build and publish a release with that name.
# - Or run it by hand from the Actions tab to get the installers as run artifacts only.
on:
  push:
    branches:
      - main
      - claude/beautiful-euler-b2t7tl
    paths:
      - "index.html"
      - "desktop/**"
      - ".github/workflows/nestguard-installers.yml"
    tags:
      - "v*"
      - "nestguard-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#nestguard-}"
          npm version "${V#v}" --no-git-tag-version --allow-same-version

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: nestguard-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Nestguard ${{ steps.tag.outputs.name }}
          make_latest: true
          files: dist/*
          body: |
            Desktop installers for Nestguard.

            - **Windows:** download the `.exe` and run it. If SmartScreen warns, click **More info → Run anyway** (the installer is not code-signed).
            - **macOS:** download the `.dmg`, drag Nestguard to Applications, then right-click it and choose **Open** the first time.
            - **Linux:** download the `.AppImage`, make it executable (`chmod +x`), and run it.
