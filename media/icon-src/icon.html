<!doctype html><html><head><meta charset="utf-8">
<!-- The Nestguard app icon: the logo in gold on green, signed with a golden quill. Rendered to PNG by render.js. -->
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@800&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
#c{position:relative;width:1024px;height:1024px;overflow:hidden}
#c.bg{background:radial-gradient(circle at 50% 42%,#33492b 0%,#22311d 45%,#141d12 100%)}
#c.round{border-radius:180px}
#c.bg::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 10px rgba(232,184,74,.18),inset 0 0 120px rgba(0,0,0,.45);pointer-events:none}
#c.nob::after{display:none}
#art{position:absolute;left:0;top:0;width:1024px;height:1024px;transform-origin:512px 512px}
#art svg{position:absolute;left:0;top:0;width:1024px;height:1024px;overflow:visible}
.t{position:absolute;left:0;top:380px;white-space:nowrap;font-family:"Grenze Gotisch";font-weight:800;font-size:196px;line-height:1;letter-spacing:-.01em;
 background:linear-gradient(180deg,#ffe7a0 0%,#f4cc5a 40%,#e0a832 70%,#b8801e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 6px 0 #4a3410) drop-shadow(0 14px 18px rgba(0,0,0,.55))}
</style></head><body>
<div id="c"><div id="art">
<svg id="back" viewBox="0 0 1024 1024"></svg>
<span class="t" id="t">Nestguard</span>
<svg id="front" viewBox="0 0 1024 1024"></svg>
</div></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const mk = (tag, at, parent) => { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); if (parent) parent.append(n); return n; };
const DEFS = `<defs>
 <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#f2c650"/><stop offset="1" stop-color="#b47a1c"/></linearGradient>
 <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d0922a"/><stop offset=".6" stop-color="#f4cc5a"/><stop offset="1" stop-color="#ffe7a0"/></linearGradient>
 <linearGradient id="q" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a14"/><stop offset="1" stop-color="#fff2c4"/></linearGradient>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".5"/></filter>
</defs>`;
const SIZE = 196;

function draw() {
  const back = document.getElementById('back'), front = document.getElementById('front'), t = document.getElementById('t');
  back.innerHTML = DEFS; front.innerHTML = '';
  // centre the word horizontally, then measure it (untransformed, so page px = design px)
  t.style.left = ((1024 - t.offsetWidth) / 2 - 40) + 'px';
  const L = t.offsetLeft, R = L + t.offsetWidth, base = t.offsetTop + SIZE * .78;

  // The quill's nib touches down just past the end of the word: that's where the signature finishes.
  const nx = R + 8, ny = base + 40;
  // The signature: one calligraphic stroke that starts with a small loop under the N, dips under the word and ends at the nib.
  const P = [[L + 50, base + 6], [L - 25, base + 52], [L + 45, base + 96], [L + 190, base + 66],
             [L + 360, base + 36], [nx - 240, base + 92], [nx, ny]];
  const bez = (p0, p1, p2, p3, u) => { const v = 1 - u; return [0, 1].map(i => v*v*v*p0[i] + 3*v*v*u*p1[i] + 3*v*u*u*p2[i] + u*u*u*p3[i]); };
  const pts = []; for (let i = 0; i < 2; i++) for (let k = i ? 1 : 0; k <= 48; k++) pts.push(bez(P[i*3], P[i*3+1], P[i*3+2], P[i*3+3], k / 48));
  const n = pts.length, A = [], B = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, u = i / (n - 1);
    // pen pressure: hairline start, full in the sweep, thinning into the nib; a broad nib is fatter on up/down strokes
    const wd = (2 + 21 * Math.sin(Math.PI * Math.min(1, u * 1.1)) ** .7) * (.7 + .5 * Math.abs(dy / d)) * (u > .88 ? .3 + .7 * (1 - u) / .12 : 1);
    A.push([pts[i][0] - dy / d * wd / 2, pts[i][1] + dx / d * wd / 2]); B.unshift([pts[i][0] + dy / d * wd / 2, pts[i][1] - dx / d * wd / 2]);
  }
  const poly = [...A, ...B].map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const sig = mk('g', { filter: 'url(#sh)' }, back);
  mk('polygon', { points: poly, fill: '#4a3410', transform: 'translate(0 4)' }, sig);
  mk('polygon', { points: poly, fill: 'url(#ink)' }, sig);
  mk('ellipse', { cx: nx, cy: ny, rx: 8, ry: 5, fill: '#f4cc5a' }, sig);

  // The quill, drawn along +x from the nib at the origin, then turned to lean up and to the right.
  const len = 330, q = mk('g', { transform: `translate(${nx} ${ny}) rotate(-58)`, filter: 'url(#sh)' }, front);
  // vane: narrow near the shaft, widest two thirds along, pointed tip; the upper side is broader
  const vane = `M64 0 C90 -14 140 -40 210 -50 C270 -56 312 -40 ${len + 14} -6 C${len - 4} 4 300 18 250 30 C190 42 120 30 64 4 Z`;
  q.innerHTML = `
   <path d="M0 0 L22 -6 L36 0 L22 6 Z" fill="#4a3008"/>
   <path d="M3 0 L24 0" stroke="#f4cc5a" stroke-width="1.6"/>
   <path d="M30 0 L64 0" stroke="#b07a20" stroke-width="7" stroke-linecap="round"/>
   <path d="${vane}" fill="url(#g)" stroke="#7a5010" stroke-width="4" stroke-linejoin="round"/>
   <g stroke="#a06a18" stroke-width="2.2" opacity=".7" fill="none">
     ${[100, 130, 160, 190, 220, 250, 280, 305].map(x => `<path d="M${x} -2 Q${x + 18} -18 ${x + 36} ${-Math.max(8, 44 - Math.abs(x - 210) * .28)}"/>`).join('')}
     ${[100, 130, 160, 190, 220, 250, 280].map(x => `<path d="M${x} 2 Q${x + 16} 12 ${x + 30} ${Math.max(6, 28 - Math.abs(x - 200) * .2)}"/>`).join('')}
   </g>
   <path d="M150 -30 L138 -14 M236 -44 L224 -26 M206 26 L196 14" stroke="#7a5010" stroke-width="4.5" stroke-linecap="round"/>
   <path d="M60 0 C150 -2 260 -4 ${len + 10} -5" stroke="url(#q)" stroke-width="4" stroke-linecap="round" fill="none"/>`;
  // a couple of sparkles
  for (const [x, y, k] of [[L - 8, base - 150, 1], [nx + 150, ny - 300, .8]])
    mk('path', { d: `M${x} ${y - 13 * k} l${5 * k} ${8 * k} l${8 * k} ${5 * k} l${-8 * k} ${5 * k} l${-5 * k} ${8 * k} l${-5 * k} ${-8 * k} l${-8 * k} ${-5 * k} l${8 * k} ${-5 * k}z`, fill: '#fff6d0', opacity: .85 }, front);
}

function recenter(scale) {
  // move the whole drawing (word + signature + quill) into the middle, then scale it about the centre
  const boxes = [document.getElementById('back').getBBox(), document.getElementById('front').getBBox()], t = document.getElementById('t');
  boxes.push({ x: t.offsetLeft, y: t.offsetTop, width: t.offsetWidth, height: t.offsetHeight });
  const x0 = Math.min(...boxes.map(b => b.x)), y0 = Math.min(...boxes.map(b => b.y)), x1 = Math.max(...boxes.map(b => b.x + b.width)), y1 = Math.max(...boxes.map(b => b.y + b.height));
  document.getElementById('art').style.transform = `scale(${scale}) translate(${512 - (x0 + x1) / 2}px, ${512 - (y0 + y1) / 2}px)`;
}

// modes: icon (square), round (rounded corners), fg (Android adaptive foreground: art only, smaller), bgonly (Android background), splash (2732px)
const mode = new URLSearchParams(location.search).get('m') || 'icon', c = document.getElementById('c'), art = document.getElementById('art');
const [scale, size] = { icon: [.86, 1024], round: [.86, 1024], fg: [.6, 1024], bgonly: [0, 1024], splash: [1.1, 2732] }[mode];
c.style.width = c.style.height = size + 'px';
if (mode !== 'fg') c.classList.add('bg');
if (mode === 'round') c.classList.add('round');
if (mode === 'splash') { c.classList.add('nob'); c.style.background = 'radial-gradient(circle at 50% 45%,#2a3c24 0%,#1d261b 40%,#0b0a08 100%)'; art.style.left = art.style.top = (size - 1024) / 2 + 'px'; }
if (mode === 'bgonly') { art.remove(); document.body.dataset.ready = 1; }
else document.fonts.ready.then(() => { draw(); recenter(scale); document.body.dataset.ready = 1; });
</script></body></html>
